<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="45%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Android Head gradient (frosted pearl / glossy white) -->
    <linearGradient id="headGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </linearGradient>

    <!-- Drop shadow for the outer card -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Shadow for Android Head -->
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#004D40" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect 
    x="64" 
    y="64" 
    width="384" 
    height="384" 
    rx="96" 
    fill="url(#bgGradient)" 
    filter="url(#dropShadow)" 
  />

  <!-- Top highlight border -->
  <rect 
    x="64" 
    y="64" 
    width="384" 
    height="384" 
    rx="96" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="3" 
    stroke-opacity="0.35" 
  />

  <!-- Android Robot Head Element -->
  <g filter="url(#elementShadow)">
    <!-- Antenna Left -->
    <line 
      x1="206" y1="210" 
      x2="182" y2="162" 
      stroke="url(#headGradient)" 
      stroke-width="16" 
      stroke-linecap="round" 
    />
    
    <!-- Antenna Right -->
    <line 
      x1="306" y1="210" 
      x2="330" y2="162" 
      stroke="url(#headGradient)" 
      stroke-width="16" 
      stroke-linecap="round" 
    />

    <!-- Head Dome (Semicircle with rounded bottom corners) -->
    <path 
      d="M 166 312 
         L 346 312 
         A 9 9 0 0 0 355 303 
         A 99 99 0 0 0 157 303 
         A 9 9 0 0 0 166 312 Z" 
      fill="url(#headGradient)" 
    />

    <!-- Left Eye -->
    <circle cx="212" cy="254" r="11" fill="#00838F" />

    <!-- Right Eye -->
    <circle cx="300" cy="254" r="11" fill="#00838F" />
  </g>
</svg>